name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      NULLWAKE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost/nullwake_test
      NULLWAKE_TEST_WAREHOUSE_DSN: host=localhost dbname=warehouse user=postgres password=postgres
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE nullwake_test"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE warehouse"
      - run: pytest
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' .env && docker compose config --quiet
      - run: docker build -t nullwake:ci .
      - name: Smoke test the image
        run: |
          docker run --rm nullwake:ci nullwake --help
          docker run --rm nullwake:ci python -c "import nullwake.app, nullwake.worker; print('ok')"
