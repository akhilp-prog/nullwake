[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nullwake"
version = "0.7.0"
description = "Data reliability for teams that own production pipelines: data contracts, freshness, volume and schema monitoring, and incident response that runs inside your network."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Akhil Varma" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.10"]
bigquery = ["google-cloud-bigquery>=3.25"]
dev = ["pytest>=8", "fakesnow>=0.12", "snowflake-connector-python>=3.10,<4"]

[project.scripts]
nullwake = "nullwake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nullwake = ["templates/*.html", "static/*", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
