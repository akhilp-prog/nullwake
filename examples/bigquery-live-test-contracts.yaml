apiVersion: nullwake/v1
kind: Connection
metadata:
  name: bigquery-live
spec:
  type: bigquery
  project: __PROJECT__
  credentialsFileEnv: BQ_KEY
  maximumBytesBilled: 1073741824
---
apiVersion: nullwake/v1
kind: DataContract
metadata:
  name: orders
  owner: akhil@nullwake.si
spec:
  connection: bigquery-live
  dataset: nw_demo.orders
  schedule: {intervalMinutes: 15}
  schema:
    allowAdditionalColumns: false
    columns:
      - {name: order_id, type: bigint, nullable: false}
      - {name: customer_id, type: bigint}
      - {name: amount, type: numeric}
      - {name: status, type: text}
      - {name: loaded_at, type: timestamp}
  uniqueKey: [order_id]
  freshness: {column: loaded_at, maxAgeMinutes: 30}
  volume: {column: loaded_at, windowHours: 1, lookbackWindows: 6, tolerancePct: 40, minRows: 10}
  checks:
    - name: no_negative_amounts
      sql: select count(*) from nw_demo.orders where amount < 0
      maxValue: 0
